<title>OneWindow Care Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: app shell. Demo banner + top bar, left rail nav, scrolling work surface, slide-over client drawer, scenario narrator docked bottom-left. */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface-2:#E9EFED; --line:#D4DDDA; --fg:#132220;
  --muted:#556763; --teal:#0E5C57; --teal-ink:#0A4541; --teal-soft:#DAEBE8; --on-teal:#FFFFFF;
  --amber:#8F5A0E; --amber-soft:#FBEED3; --red:#A3322C; --red-soft:#F7E0DC; --green:#256B46; --green-soft:#DDEFE3;
  --banner:#FFE38A; --banner-fg:#3D3000; --scrim:rgba(10,24,22,.38);
  --shadow:0 1px 2px rgba(16,40,36,.06),0 6px 18px rgba(16,40,36,.07);
  --f-ui:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1614; --surface:#14201E; --surface-2:#1A2826; --line:#293936; --fg:#E2ECEA; --muted:#93A6A2;
  --teal:#56B6AD; --teal-ink:#86D0C8; --teal-soft:#16332F; --on-teal:#062321;
  --amber:#E3A94F; --amber-soft:#382A10; --red:#EC857B; --red-soft:#3A1C19; --green:#71C593; --green-soft:#15301F;
  --banner:#4B3D0C; --banner-fg:#FFE58F; --scrim:rgba(0,0,0,.55); --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1614; --surface:#14201E; --surface-2:#1A2826; --line:#293936; --fg:#E2ECEA; --muted:#93A6A2;
  --teal:#56B6AD; --teal-ink:#86D0C8; --teal-soft:#16332F; --on-teal:#062321;
  --amber:#E3A94F; --amber-soft:#382A10; --red:#EC857B; --red-soft:#3A1C19; --green:#71C593; --green-soft:#15301F;
  --banner:#4B3D0C; --banner-fg:#FFE58F; --scrim:rgba(0,0,0,.55); --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.3);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14.5px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
h2{font-size:15px;font-weight:700}
h3{font-size:13.5px;font-weight:700}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

.app{display:flex;flex-direction:column;height:100%}
.banner{background:var(--banner);color:var(--banner-fg);font-size:12.5px;font-weight:600;padding:6px 16px;text-align:center;letter-spacing:.01em}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;white-space:nowrap}
.brand .mark{width:28px;height:28px;border-radius:7px;background:var(--teal);color:var(--on-teal);display:grid;place-items:center}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.search{position:relative;flex:1 1 220px;min-width:0;max-width:420px}
.search input{width:100%;padding:8px 10px 8px 34px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.sres{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:40;max-height:320px;overflow:auto}
.sres button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:8px 12px;border:0;background:none;cursor:pointer}
.sres button:hover{background:var(--surface-2)}
.top-right{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
.date{font-size:12.5px;color:var(--muted);white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 10px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--teal);color:var(--on-teal)}
.iconbtn{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.iconbtn .dot{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;border-radius:10px;padding:1px 5px}

.shell{display:flex;flex:1;min-height:0}
.rail{width:224px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding-block:12px;padding-inline:10px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.rail .grp{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px;font-weight:700}
.rail button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left;color:var(--fg);font-weight:500;white-space:nowrap}
.rail button:hover{background:var(--surface-2)}
.rail button.on{background:var(--teal-soft);color:var(--teal-ink);font-weight:700}
.rail button .cnt{margin-left:auto;font-size:11.5px;font-weight:700;background:var(--surface-2);border-radius:10px;padding:1px 7px;color:var(--muted)}
.rail button .cnt.crit{background:var(--red-soft);color:var(--red)}
main{flex:1;min-width:0;overflow:auto;padding-block:20px 120px;padding-inline:24px}

.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sub{color:var(--muted);font-size:13px;margin-top:3px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--teal)}
.btn-p{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.btn-p:hover{background:var(--teal-ink);border-color:var(--teal-ink)}
.btn-s{padding:4px 9px;font-size:12px}
.btn-warn{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.btn-danger{background:var(--red-soft);border-color:transparent;color:var(--red)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.spin{width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.grid-2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.kpi:hover{border-color:var(--teal)}
.kpi .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi.crit .v{color:var(--red)} .kpi.warn .v{color:var(--amber)} .kpi.ok .v{color:var(--green)}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.c-crit{background:var(--red-soft);color:var(--red)} .c-warn{background:var(--amber-soft);color:var(--amber)}
.c-ok{background:var(--green-soft);color:var(--green)} .c-info{background:var(--teal-soft);color:var(--teal-ink)}
.sev{width:4px;align-self:stretch;border-radius:3px;background:var(--line);flex:none}
.sev.crit{background:var(--red)} .sev.warn{background:var(--amber)} .sev.ok{background:var(--green)}

.qlist{display:flex;flex-direction:column;gap:8px}
.qi{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.qi .body{flex:1;min-width:0}
.qi .t{font-weight:600}
.qi .m{font-size:12.5px;color:var(--muted)}
.qi .kind{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted)}

.srcs{display:flex;flex-direction:column}
.src{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.src:last-child{border-bottom:0}
.src .role{font-size:11.5px;color:var(--muted)}
.feed{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow:auto}
.feed div{display:grid;grid-template-columns:60px 1fr;gap:8px;font-size:12.5px}
.feed .tm{color:var(--muted);font-variant-numeric:tabular-nums}

.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.nw{white-space:nowrap}
.bar{height:7px;border-radius:5px;background:var(--surface-2);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--teal);border-radius:5px}
.bar.warn i{background:var(--amber)} .bar.crit i{background:var(--red)}
.clickname{background:none;border:0;padding:0;font-weight:700;cursor:pointer;color:var(--teal-ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}

.board{display:grid;grid-auto-flow:column;grid-auto-columns:230px;gap:10px;overflow-x:auto;padding-bottom:10px}
.col{background:var(--surface-2);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:8px;min-height:180px}
.col-h{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:4px 4px 2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.card .top-l{display:flex;justify-content:space-between;align-items:center;gap:6px}
.card .ini{font-weight:800;font-size:15px}
.card .svc{font-size:12.5px;font-weight:600}
.card .pl{font-size:12px;color:var(--muted)}
.card .chips{display:flex;flex-wrap:wrap;gap:4px}
.card .msg{font-size:12px;background:var(--amber-soft);color:var(--amber);padding:6px 8px;border-radius:6px;font-weight:600}
.card .acts{display:flex;gap:6px;justify-content:space-between}
.mini{font-size:12px;padding:6px 8px;background:var(--surface);border:1px solid var(--line);border-radius:6px;display:flex;justify-content:space-between;cursor:pointer;text-align:left}

.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.15);z-index:60;overflow:auto;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));padding-inline:20px}
#scrim{position:fixed;inset:0;background:var(--scrim);z-index:55}
.dsec{border-top:1px solid var(--line);padding-top:14px;margin-top:14px;display:flex;flex-direction:column;gap:8px}
.dsec h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;min-width:0}
.route{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.route div{background:var(--surface-2);border-radius:8px;padding:8px 10px}
.route small{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.route b{font-size:13px}
.flag{background:var(--red-soft);color:var(--red);border-radius:8px;padding:10px 12px;font-size:13px;font-weight:600}
.check{display:flex;flex-direction:column;gap:5px}
.check div{display:flex;gap:8px;align-items:center;font-size:13px}
.ck{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none;background:var(--surface-2);color:var(--muted)}
.ck.y{background:var(--green-soft);color:var(--green)} .ck.n{background:var(--red-soft);color:var(--red)}

.els{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.el{border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:12px}
.el small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.el.bad{border-color:var(--red);background:var(--red-soft)}
.el.bad small,.el.bad b{color:var(--red)}
.exc{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.exc .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}

.mx td.st{text-align:center;padding:6px}
.dst{border:0;background:none;cursor:default;width:30px;height:28px;border-radius:6px;font-weight:800;font-size:13px}
.dst.ok{color:var(--green)} .dst.na{color:var(--muted)}
.dst.missing{background:var(--red-soft);color:var(--red);cursor:pointer}
.dst.expired{background:var(--red-soft);color:var(--red);cursor:pointer}
.dst.expiring{background:var(--amber-soft);color:var(--amber);cursor:pointer}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}

.cal{display:grid;grid-template-columns:150px repeat(7,minmax(90px,1fr));min-width:820px}
.cal > div{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px;font-size:12px;min-height:44px}
.cal .hd{background:var(--surface-2);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cal .today{background:var(--teal-soft)}
.vis{display:block;background:var(--teal-soft);color:var(--teal-ink);border-radius:5px;padding:2px 5px;margin-bottom:3px;font-weight:600;font-size:11.5px}
.vis.new{background:var(--amber-soft);color:var(--amber)}

.hbar{display:grid;grid-template-columns:170px 1fr 34px;gap:10px;align-items:center;font-size:13px}
.hbar .t{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.hbar .t i{display:block;height:100%}

.report{white-space:pre-wrap;font-family:var(--f-mono);font-size:12.5px;line-height:1.6;background:var(--surface-2);border-radius:8px;padding:16px;overflow-x:auto;max-width:78ch}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600}
.field input,.field select,.field textarea{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-weight:400}
textarea{resize:vertical}
.tabs{display:inline-flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:9px}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

#modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:var(--scrim);padding:16px}
.mbox{background:var(--surface);border-radius:12px;width:min(560px,100%);max-height:88vh;overflow:auto;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
#toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:90;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:13px;font-weight:600;box-shadow:var(--shadow);animation:tin .2s ease-out}
.toast.warn{background:var(--amber);color:#1b1200} .toast.crit{background:var(--red);color:#fff}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

#scen{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(390px,calc(100vw - 32px));z-index:70;background:var(--surface);border:2px solid var(--teal);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.25);padding:16px;display:flex;flex-direction:column;gap:10px}
#scen .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--teal-ink)}
#scen .prog{height:4px;background:var(--surface-2);border-radius:3px;overflow:hidden}
#scen .prog i{display:block;height:100%;background:var(--teal)}
#scen p{font-size:13.5px}
.hl{outline:3px solid var(--amber)!important;outline-offset:3px;animation:pulse 1.4s ease-in-out 3}
@keyframes pulse{50%{outline-color:transparent}}
.guard{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.empty{padding:24px;text-align:center;color:var(--muted);font-size:13px}

@media (max-width: 1100px){.grid-2{grid-template-columns:minmax(0,1fr)}}
@media (max-width: 860px){
  .shell{flex-direction:column}
  .rail{width:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:6px}
  .rail .grp{display:none}
  main{padding-inline:16px}
  .date{display:none}
}
@media (max-width: 520px){.route{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.hbar{grid-template-columns:110px 1fr 28px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <div class="banner" role="note">DEMO ENVIRONMENT. All names, IDs and records are fictional. Concept prototype with simulated connections only.</div>
  <header class="top">
    <div class="brand"><span class="mark" id="markIc"></span><span>OneWindow<small>Care Ops · concept</small></span></div>
    <div class="search"><span id="searchIc"></span><input id="gsearch" type="search" placeholder="Search clients, caregivers, auth numbers" autocomplete="off" aria-label="Search"><div class="sres" id="sres" hidden></div></div>
    <div class="top-right">
      <span class="date" id="today"></span>
      <div class="seg" role="group" aria-label="Role">
        <button data-a="role" data-r="coord" id="r-coord">Coordinator</button>
        <button data-a="role" data-r="sup" id="r-sup">Supervisor</button>
      </div>
      <button class="iconbtn" data-a="go" data-v="approvals" id="bell" aria-label="Approvals and alerts"></button>
      <button class="iconbtn" data-a="theme" id="themeBtn" aria-label="Toggle dark mode"></button>
      <button class="btn btn-p" data-a="scenMenu" id="scenBtn"></button>
    </div>
  </header>
  <div class="shell">
    <nav class="rail" id="rail" aria-label="Modules"></nav>
    <main id="main"></main>
  </div>
</div>
<div id="scrim" hidden data-a="closeDrawer"></div>
<aside id="drawer" class="drawer" hidden aria-label="Client record"></aside>
<div id="modal" hidden></div>
<div id="scen" hidden></div>
<div id="toasts" aria-live="polite"></div>

<script>
/* ============================ utilities ============================ */
const $=s=>document.querySelector(s);
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const dd=n=>{const d=new Date(TODAY);d.setDate(d.getDate()+n);return d};
const fd=n=>dd(n).toLocaleDateString('en-US',{month:'short',day:'numeric'});
const fdw=n=>dd(n).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const clock=()=>new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
const sim=(a=600,b=1200)=>new Promise(r=>setTimeout(r,a+Math.random()*(b-a)));

  S.auths.filter(a=>a.end<=30&&a.ren!=='Renewed').forEach(a=>{const c=cl(a.cid);q.push({sev:a.end<=S.settings.lead?'crit':'warn',kind:'Authorization',t:`${c.ini} · ${a.code} ends in ${a.end} days`,m:`Renewal: ${a.ren} · ${route(c.plan).auth}`,btn:'Go to renewal',a:'go',v:'auths',hl:'auth-'+a.id,rank:a.end<=S.settings.lead?1:3})});
  openEvv().forEach(e=>{const c=cl(e.cid);q.push({sev:e.status==='pending'?'warn':'crit',kind:'EVV exception',t:`${c.ini} · ${e.type}`,m:`${route(c.plan).evv} · ${fd(e.date)} · ${e.status==='pending'?'awaiting verification':'fix before billing cutoff'}`,btn:'Resolve',a:'go',v:'evv',hl:'evv-'+e.id,rank:e.status==='pending'?4:2})});
  missingDocs().forEach(([k,s])=>{const [cid,d]=k.split('|');const c=cl(cid);const esc=escalated(k);q.push({sev:esc?'crit':'warn',kind:'Document',t:`${c.ini} · ${d} ${s}`,m:`Owner: ${DOC_OWNER[d]}${esc?' · no response in '+S.settings.esc+'h, escalate':''}`,btn:'Follow up',a:'doc',k,rank:esc?1:5})});
  const o={crit:0,warn:1};
  return q.sort((a,b)=>o[a.sev]-o[b.sev]||a.rank-b.rank);
}

const NAV=[

function renderChrome(){

pipeline(){

/* ============================ actions ============================ */
function go(v){S.view=v;closeDrawer();render();$('#main').scrollTop=0}
async function withBusy(key,fn){S.busy[key]=1;render();try{await fn()}finally{delete S.busy[key];render()}}

function advance(id){
  const c=cl(id);delete S.cardMsg[id];
  if(c.blockers.length){S.cardMsg[id]='Blocked: '+c.blockers.map(b=>b.label).join('; ')+'. Clear these first.';toast('Cannot advance '+c.ini+': open blocker','warn');render();return false}
  if(c.stage===1&&c.elig.result!=='Active'){addB(c,'elig','Eligibility not confirmed');S.cardMsg[id]='Run an NCTracks check and get an Active result first.';render();return false}
  if(c.stage===2&&!authFor(id).length){addB(c,'auth','No authorization on file');S.cardMsg[id]='No authorization found. Follow up with '+route(c.plan).auth+'.';render();return false}
  if(c.stage===3){const m=(c.prog==='HC'?HC_DOCS:BH_DOCS).filter(d=>['missing','expired'].includes(S.docs[c.id+'|'+d]));if(m.length){m.forEach(d=>addB(c,'doc:'+d,d+' missing'));S.cardMsg[id]='Documents missing: '+m.join(', ')+'.';render();return false}}
  if(c.stage===4&&!c.cg){S.cardMsg[id]='No staff assigned. Use Suggest match in Scheduling, then send to supervisor.';render();return false}
  if(c.stage===8){if(!S.approvals.some(a=>a.kind==='start'&&a.cid===id&&a.status==='pending')){S.approvals.push({id:'AP'+Date.now(),kind:'start',cid:id,label:'Service start for '+c.ini,detail:'All readiness items complete. First visit monitored.',at:clock(),status:'pending'});log('Service start for '+c.ini+' sent to supervisor')}S.cardMsg[id]='Service start sent to supervisor for approval.';toast('Sent to supervisor for approval');render();return false}
  c.stage++;c.since=0;log(`${c.ini} moved to ${STAGES[c.stage]}`);toast(`${c.ini} → ${STAGES[c.stage]}`);render();return true;
}
async function runElig(id,key){
  const c=cl(id);await withBusy(key,async()=>{const r=await MockAPI.nctracks(c);S.stats.elig++;
    c.elig={date:0,t:clock(),result:r.result,note:r.note};
    if(r.result==='Active'){rmB(c,'elig');c.alert=null;toast(`${c.ini}: Active · ${r.plan}`)}
    else if(r.result==='Active, plan changed'){const old=c.plan;c.plan=r.plan;toast(`${c.ini}: plan changed to ${r.plan}`,'warn');log(`${c.ini} plan changed from ${old} to ${r.plan}. Auth source and EVV route updated.`);addTask(c.id,'Confirm authorization with new plan ('+r.plan+')','Portal','Tomorrow 10:00 AM')}
    else if(r.result==='Inactive'){c.alert='Eligibility returned Inactive in NCTracks';toast(`${c.ini}: Inactive in NCTracks`,'crit');addTask(c.id,'Confirm coverage with client and county DSS','Phone','Today 3:00 PM')}
    else{if(c.stage<9)addB(c,'elig','Eligibility pending (NC FAST)');toast(`${c.ini}: pending update from NC FAST`,'warn')}
    log(`NCTracks eligibility check for ${c.ini}: ${r.result}`);});
}
function addTask(cid,text,ch,due){const t={id:'T'+Date.now()+Math.floor(Math.random()*99),cid,text,owner:COORD,ch,due,status:'open',att:1};S.tasks.unshift(t);return t}
async function renew(id){
  const a=S.auths.find(x=>x.id===id);const c=cl(a.cid);S.stats.authChecked++;
  await withBusy('rn-'+id,async()=>{
    if(a.ren==='Not started'){await MockAPI.send();a.ren='Documents gathered';log(`Renewal packet gathered for ${c.ini} ${a.code}`)}
    else if(a.ren==='Documents gathered'){await MockAPI.send();a.ren='Sent to supervisor';S.approvals.push({id:'AP'+Date.now(),kind:'renewal',ref:a.id,cid:c.id,label:`Authorization renewal: ${a.code} ${a.svc.toLowerCase()}`,detail:`Ends ${fd(a.end)}. Packet ready for ${route(c.plan).auth}.`,at:clock(),status:'pending'});log(`Renewal for ${c.ini} ${a.code} sent to supervisor`);toast('Sent to supervisor for approval')}
    else if(a.ren==='Submitted to payer'){await MockAPI.payer();a.ren='Awaiting decision';log(`Payer status for ${c.ini}: received, in review`);toast('Payer shows request in review')}
    else if(a.ren==='Awaiting decision'){await MockAPI.payer();a.ren='Renewed';a.start=a.end+1;a.end=a.end+90;a.used=0;log(`Authorization renewed for ${c.ini}: ${fd(a.start)}–${fd(a.end)}. Scheduling notified.`);toast(`Renewed through ${fd(a.end)}. Scheduling notified.`)}
  });
}
async function evvAction(kind,id){
  const e=S.evv.find(x=>x.id===id);const c=cl(e.cid);
  if(kind==='mark'&&!e.reason){toast('Add a reason code before marking corrected','warn');return}
  await withBusy((kind==='mark'?'mk-':'rq-')+id,async()=>{await MockAPI.send();
    e.status='pending';
    S.approvals.push({id:'AP'+Date.now(),kind:'evv',ref:e.id,cid:c.id,label:(kind==='mark'?'Verify corrected visit: ':'EVV correction: ')+e.type.toLowerCase(),detail:`${cgName(e.cg)} · ${fd(e.date)} · ${route(c.plan).evv} · reason: ${e.reason||'not given'}`,at:clock(),status:'pending'});
    log(`EVV ${e.type.toLowerCase()} for ${c.ini} ${kind==='mark'?'marked corrected, pending verification':'sent to supervisor for correction'}`);toast('Sent to supervisor');});
}
function applyApproval(ap){
  const c=cl(ap.cid);
  if(ap.kind==='match'){c.cg=ap.cg;rmB(c,'match');if(c.stage===4){c.stage=5;c.since=0}log(`Match approved: ${cgName(ap.cg)} for ${c.ini}`)}
  if(ap.kind==='renewal'){const a=S.auths.find(x=>x.id===ap.ref);a.ren='Submitted to payer';log(`Renewal for ${c.ini} approved and submitted to ${route(c.plan).auth}`)}
  if(ap.kind==='evv'){const e=S.evv.find(x=>x.id===ap.ref);e.status='verified';S.stats.evvResolved++;S.visits.filter(v=>v.ex===e.id).forEach(v=>v.status='ready');log(`EVV exception for ${c.ini} verified. Visit moved to verified for billing.`)}
  if(ap.kind==='start'){c.stage=9;c.since=0;log(`Service start approved for ${c.ini}`)}
  if(ap.kind==='escalation'){log(`Escalation acknowledged for ${c.ini}: supervisor will contact care manager and Enrollment Broker`)}
  if(ap.kind==='docesc'){log(`Document escalation acknowledged for ${c.ini}`)}
}
async function approve(id){const ap=S.approvals.find(a=>a.id===id);await withBusy('ap-'+id,async()=>{await MockAPI.send();ap.status='approved';applyApproval(ap);toast('Approved: '+ap.label)})}
function returnAp(id){const ap=S.approvals.find(a=>a.id===id);ap.status='returned';
  if(ap.kind==='renewal'){S.auths.find(x=>x.id===ap.ref).ren='Documents gathered'}
  if(ap.kind==='evv'){S.evv.find(x=>x.id===ap.ref).status='open'}
  log(`Returned to coordinator: ${ap.label}`);toast('Returned to coordinator');render()}
function suggest(){
  const c=cl(S.matchFor);if(!c)return;
  const need=c.svc==='Home Health'?'Home health aide':'Personal care';
  const list=S.cgs.map(g=>{let s=50;const why=[];
    if(g.town===c.town){s+=20;why.push(g.town+', about 2 mi')}else{why.push(g.town+', 12+ mi')}
    if(g.skills.includes(need)){s+=15;why.push(need.toLowerCase())}
    const exp=[['CPR',g.cpr],['TB',g.tb],['background',g.bg]].filter(x=>x[1]<0);if(exp.length){s-=60;why.push(exp.map(x=>x[0]).join(', ')+' expired')}else why.push('credentials current');
    const load=S.sched.filter(x=>x.cg===g.id).length;s-=load*3;why.push(load+' visits this week');
    if(g.lang.length>1){s+=2;why.push(g.lang.join('/'))}
    return{g,score:s,why}}).filter(m=>m.score>0).sort((a,b)=>b.score-a.score).slice(0,3);
  S.matchRes={cid:c.id,list};
}
function sendMatch(cg){const c=cl(S.matchFor);S.approvals.filter(a=>a.kind==='match'&&a.cid===c.id&&a.status==='pending').forEach(a=>a.status='returned');
  S.approvals.push({id:'AP'+Date.now(),kind:'match',cid:c.id,cg,label:'Caregiver match for '+c.ini,detail:cgName(cg)+' suggested for '+c.svc.toLowerCase()+'.',at:clock(),status:'pending'});

function docSend(k,ch='Secure email',dl='24 hours'){const [cid,d]=k.split('|');const c=cl(cid);S.docReq[k]=S.docReq[k]||{hist:[]};S.docReq[k].hist.push({at:Date.now(),to:DOC_OWNER[d],ch});S.docReq[k].deadline=dl;S.stats.docsFollowed++;
  const t=S.tasks.find(t=>t.cid===cid&&t.text.includes(d)&&t.status==='open');if(t)t.att++;else addTask(cid,`Obtain ${d} from ${DOC_OWNER[d].toLowerCase()}`,ch,'Due in '+dl);
  log(`Request sent for ${c.ini} ${d} to ${DOC_OWNER[d]} (${ch}, due in ${dl})`)}
function docRecv(k){const [cid,d]=k.split('|');const c=cl(cid);S.docs[k]='ok';rmB(c,'doc:'+d);if(d==='Person-Centered Plan'&&c.pcp)c.pcp={status:'Signed',review:180};if(d==='Service order')c.so='On file';if(d==='CCA'&&!c.cca)c.cca={date:0,clin:'Licensed clinician'};
  S.tasks.filter(t=>t.cid===cid&&t.text.includes(d)).forEach(t=>t.status='done');
  if(d==='Progress notes')S.visits.filter(v=>v.cid===cid&&v.status==='note').forEach(v=>v.status='ready');
  log(`${d} received for ${c.ini}. Tracker updated.`)}

function buildEod(){
  const refs=referrals();const k=kpis();const exp=S.auths.filter(a=>a.end<=30&&a.ren!=='Renewed');
  const lines=[];const L=s=>lines.push(s);
  L(`END-OF-DAY CLOSURE REPORT`);L(`${fdw(0)} · prepared by ${COORD} for ${SUPERVISOR}`);L(`Demo data only. Client initials used in place of names.`);L('');
  L(`1. REFERRALS (${refs.length} in pipeline, ${k.newToday} received today)`);refs.forEach(c=>L(`   ${c.ini.padEnd(6)} ${c.svc.slice(0,32).padEnd(33)} ${STAGES[c.stage]}${c.blockers.length?'  [blocked: '+c.blockers.map(b=>b.label).join('; ')+']':''}`));L('');
  L(`2. ELIGIBILITY`);L(`   NCTracks checks run today: ${S.stats.elig+12}`);S.clients.filter(c=>c.elig.result!=='Active').forEach(c=>L(`   ${c.ini}: ${c.elig.result}`));L('');
  L(`3. AUTHORIZATIONS (${exp.length} expiring within 30 days)`);exp.forEach(a=>L(`   ${cl(a.cid).ini.padEnd(6)} ${a.code.padEnd(9)} ends ${fd(a.end).padEnd(7)} renewal: ${a.ren}`));L('');
  const ver=S.evv.filter(e=>e.status==='verified');L(`4. EVV EXCEPTIONS (${S.evv.length} found, ${ver.length} verified, ${openEvv().length} still open)`);S.evv.forEach(e=>L(`   ${cl(e.cid).ini.padEnd(6)} ${e.type.padEnd(34)} ${route(cl(e.cid).plan).evv.padEnd(12)} ${e.status}`));L('');
  L(`5. MISSING DOCUMENTS (${missingDocs().length} outstanding)`);missingDocs().forEach(([kk])=>{const[cid,d]=kk.split('|');const r=S.docReq[kk];L(`   ${cl(cid).ini.padEnd(6)} ${d.padEnd(22)} ${r?r.hist.length+' attempt(s)':'not yet requested'}${escalated(kk)?'  ESCALATE':''}`)});L('');
  L(`6. CARRIED TO TOMORROW`);S.tasks.filter(t=>t.status==='open').forEach(t=>L(`   ${(cl(t.cid)||{ini:'-'}).ini.padEnd(6)} ${t.text}`));L('');
  L(`7. NEEDS SUPERVISOR DECISION (${pendingAp().length})`);pendingAp().forEach(a=>L(`   ${a.label}`));
  return lines.join('\n');
}

function tplText(){const c=cl($('#cpC').value);const t=$('#cpT').value;const m={
 'Missing document request':`Hello,\n\nWe are still waiting on a document for client ${c.ini} (${c.svc}). Please send it by the deadline so services are not delayed.\n\nThank you,\n${COORD}`,
 'EVV correction request to caregiver':`Hi,\n\nA recent visit for ${c.ini} needs an EVV correction. Please confirm the clock-in and clock-out times in the EVV app today.\n\nThank you,\n${COORD}`,
 'Authorization renewal reminder':`Hello,\n\nThe authorization for ${c.ini} (${route(c.plan).auth}) ends soon. The renewal packet is ready. Please confirm next steps.\n\nThank you,\n${COORD}`,
 'Escalation to supervisor':`${SUPERVISOR},\n\nEscalating an open item for ${c.ini}: ${c.blockers.map(b=>b.label).join('; ')||'see follow-up log'}. Your decision is needed to proceed.\n\n${COORD}`};return m[t]}

document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.disabled)return;const f=H[t.dataset.a];if(f){e.preventDefault&&t.tagName==='A'&&e.preventDefault();f(t.dataset,t,e)}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='authExp'){S.authExp=t.checked;render()}
  if(t.id==='evvAgg'){S.evvAgg=t.value;render()}
  if(t.id==='matchFor'){S.matchFor=t.value;S.matchRes=null;render()}
  if(t.dataset.rc){const ex=S.evv.find(x=>x.id===t.dataset.rc);ex.reason=t.value||null;if(t.value)log(`Reason code "${t.value}" added to ${ex.type.toLowerCase()} for ${cl(ex.cid).ini}`)}
  if(t.id==='set-lead'){S.settings.lead=Math.max(1,+t.value||10);log('Renewal lead time set to '+S.settings.lead+' days');render()}
  if(t.id==='set-esc'){S.settings.esc=Math.max(1,+t.value||24);log('Escalation window set to '+S.settings.esc+' hours');render()}
  if(t.id==='set-cut'){S.settings.cutoff=+t.value;log('Billing cutoff changed');render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#modal').hidden)closeModal();else if(S.drawer)closeDrawer()}; if(e.key==='Enter'&&e.target.id==='noteIn')H.addNote()});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
const gs=$('#gsearch');
gs.addEventListener('input',()=>{const q=gs.value.trim().toLowerCase();const box=$('#sres');if(!q){box.hidden=true;return}
  const res=[];S.clients.forEach(c=>{if((c.ini+' '+c.id+' '+c.town+' '+c.plan+' '+c.svc).toLowerCase().includes(q))res.push(`<button data-a="sOpen" data-id="${c.id}"><span><b>${c.ini}</b> ${c.svc}</span><span class="muted">${c.id}</span></button>`)});
  S.cgs.forEach(g=>{if(g.name.toLowerCase().includes(q))res.push(`<button data-a="sGo" data-v="schedule"><span>${g.name}</span><span class="muted">Caregiver</span></button>`)});
  S.auths.forEach(a=>{if(a.num.toLowerCase().includes(q)||a.code.toLowerCase().includes(q))res.push(`<button data-a="sGo" data-v="auths"><span>${a.num} · ${a.code}</span><span class="muted">${cl(a.cid)?cl(a.cid).ini:''}</span></button>`)});
  box.innerHTML=res.slice(0,10).join('')||'<div class="empty">No matches</div>';box.hidden=false});
H.sOpen=d=>{$('#sres').hidden=true;gs.value='';openDrawer(d.id)};
H.sGo=d=>{$('#sres').hidden=true;gs.value='';go(d.v)};
document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('#sres').hidden=true});

/* ============================ boot ============================ */
$('#markIc').innerHTML=ic('window',16);$('#searchIc').innerHTML=ic('search',15);$('#themeBtn').innerHTML=ic('moon',17);
$('#scenBtn').innerHTML=ic('play',14)+' Run Sample Scenario';
$('#today').textContent=fdw(0);
seed();render();
</script>
